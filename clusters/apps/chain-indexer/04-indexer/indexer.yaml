# Envio HyperIndex.
#
# The indexer owns its own schema: on start it creates its tables in
# ENVIO_PG_SCHEMA, then calls Hasura's metadata API to clear_metadata and
# re-track them. Hasura therefore holds NO declarative metadata of its own —
# anything applied there would be wiped on the indexer's next boot.
#
# A StatefulSet rather than a Deployment because exactly one indexer may write
# at a time: a Deployment's rolling update briefly runs two pods, while a
# StatefulSet terminates the old pod before creating its replacement.
apiVersion: v1
kind: Service
metadata:
  name: indexer
  namespace: chain-indexer
  labels:
    app: indexer
spec:
  clusterIP: None # headless; required by the StatefulSet's serviceName
  selector:
    app: indexer
  ports:
    - name: metrics
      port: 9898
      targetPort: metrics

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envio-token
  namespace: chain-indexer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: envio-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ${OP_VAULT_ENVIO_TOKEN}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: indexer
  namespace: chain-indexer
  labels:
    app: indexer
spec:
  serviceName: indexer
  replicas: 1 # never raise this
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        node-role.kubernetes.io/general: ""
      containers:
        - name: indexer
          image: chain-indexer:0.0.1
          imagePullPolicy: IfNotPresent
          env:
            # --- Postgres: the indexer creates and owns its own tables here ---
            - name: ENVIO_PG_HOST
              value: chain-indexer-rw.chain-indexer.svc.cluster.local
            - name: ENVIO_PG_PORT
              value: "5432"
            - name: ENVIO_PG_DATABASE
              value: indexer-db
            - name: ENVIO_PG_SCHEMA
              value: public
            - name: ENVIO_PG_SSL_MODE
              value: require
            # Same role Hasura connects as, so Hasura owns what it reads.
            - name: ENVIO_PG_USER
              valueFrom:
                secretKeyRef:
                  name: hasura-pass
                  key: username
            - name: ENVIO_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hasura-pass
                  key: password

            # --- Hasura: must be the /v1/metadata URL, Envio slices the path ---
            - name: ENVIO_HASURA
              value: "true"
            - name: HASURA_GRAPHQL_ENDPOINT
              value: http://hasura.chain-indexer.svc.cluster.local:8080/v1/metadata
            - name: HASURA_GRAPHQL_ROLE
              value: admin
            - name: HASURA_GRAPHQL_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: hasura-env
                  key: HASURA_GRAPHQL_ADMIN_SECRET

            # HyperSync requires a token: https://envio.dev/app/api-tokens
            - name: ENVIO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: envio-token
                  key: token

            - name: ENVIO_INDEXER_PORT
              value: "9898"
            - name: LOG_STRATEGY
              value: console-raw
          ports:
            - name: metrics
              containerPort: 9898
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
