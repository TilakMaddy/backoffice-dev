apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chain-indexer-graphql-route
  namespace: chain-indexer
  annotations:
    oatlabs.oatmilk.work/external-dns: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: gateway
      namespace: ${PLATFORM_NAMESPACE}
      sectionName: web-https
  hostnames:
    - hasura-chain-indexer.${CLUSTER_ZONE}
  rules:
    - backendRefs:
        - name: hasura
          port: 8080

---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: chain-indexer-pg-route
  namespace: chain-indexer
  annotations:
    oatlabs.oatmilk.work/external-dns: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: gateway
      namespace: ${PLATFORM_NAMESPACE}
      sectionName: postgres-direct
  hostnames:
    - postgres-chain-indexer.${CLUSTER_ZONE}
  rules:
    - backendRefs:
        - name: chain-indexer-edge
          port: 5432

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: pg-chain-indexer-allowlists
  namespace: ${PLATFORM_NAMESPACE}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway
  type: JSONPatch
  jsonPatches:
    - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
      name: "${PLATFORM_NAMESPACE}/gateway/postgres-direct"
      operation:
        jsonPath: "$.filter_chains[?(@.name == 'tlsroute/chain-indexer/chain-indexer-pg-route')]"
        path: "/filters/0"
        op: add
        value:
          name: envoy.filters.network.rbac
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
            stat_prefix: allowlist_chain_indexer
            rules:
              action: ALLOW
              policies:
                allowed-clients:
                  permissions:
                    - any: true
                  principals:
                    - direct_remote_ip: { address_prefix: "0.0.0.0", prefix_len: 0 }
                    - remote_ip: { address_prefix: "0.0.0.0", prefix_len: 0 }
