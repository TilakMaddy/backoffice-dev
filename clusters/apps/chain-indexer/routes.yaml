apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP_CHAIN_INDEXER_GRAPHQL_ROUTE}
  namespace: ${APP_CHAIN_INDEXER_NAMESPACE}
spec:
  parentRefs:
    - name: gateway
      namespace: ${PLATFORM_NAMESPACE}
      sectionName: web-https
  hostnames:
    - ${APP_CHAIN_INDEXER_HASURA_HOSTNAME}.${CLUSTER_ZONE}
  rules:
    - backendRefs:
        - name: ${APP_CHAIN_INDEXER_HASURA_SVC}
          port: ${APP_CHAIN_INDEXER_HASURA_PORT}

---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: ${APP_CHAIN_INDEXER_PG_ROUTE}-rw
  namespace: ${APP_CHAIN_INDEXER_NAMESPACE}
spec:
  parentRefs:
    - name: gateway
      namespace: ${PLATFORM_NAMESPACE}
      sectionName: postgres-direct
  hostnames:
    - ${APP_CHAIN_INDEXER_PG_HOSTNAME}-rw.${CLUSTER_ZONE}
  rules:
    - backendRefs:
        - name: ${APP_CHAIN_INDEXER_PG_POOLER}-rw
          port: 5432

---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: ${APP_CHAIN_INDEXER_PG_ROUTE}-ro
  namespace: ${APP_CHAIN_INDEXER_NAMESPACE}
spec:
  parentRefs:
    - name: gateway
      namespace: ${PLATFORM_NAMESPACE}
      sectionName: postgres-direct
  hostnames:
    - ${APP_CHAIN_INDEXER_PG_HOSTNAME}-ro.${CLUSTER_ZONE}
  rules:
    - backendRefs:
        - name: ${APP_CHAIN_INDEXER_PG_POOLER}-ro
          port: 5432
