                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 10,
            "type": "timeseries",
            "title": "Events fetched/sec",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 8,
              "y": 12,
              "w": 8,
              "h": 6
            },
            "targets": [
              {
                "refId": "A",
                "expr": "rate(envio_fetching_block_range_events_total{namespace=\"chain-indexer\"}[5m])",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "{{chainId}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ops",
                "custom": {
                  "lineWidth": 1,
