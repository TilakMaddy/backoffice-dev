                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 11,
            "type": "timeseries",
            "title": "Source requests/sec",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 16,
              "y": 12,
              "w": 8,
              "h": 6
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (source, method) (rate(envio_source_request_total{namespace=\"chain-indexer\"}[5m]))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "{{source}} {{method}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 12,
            "type": "timeseries",
            "title": "Avg source request time",
            "description": "seconds_total / request_total over the same window.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 18,
              "w": 8,
              "h": 6
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (source, method) (rate(envio_source_request_seconds_total{namespace=\"chain-indexer\"}[5m])) / sum by (source, method) (rate(envio_source_request_total{namespace=\"chain-indexer\"}[5m]))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "{{source}} {{method}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 13,
            "type": "timeseries",
            "title": "Time waiting on source",
            "description": "Counter of seconds; rate() gives the fraction of wall-clock spent there.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 8,
              "y": 18,
              "w": 8,
              "h": 6
            },
            "targets": [
              {
                "refId": "A",
                "expr": "rate(envio_indexing_source_waiting_seconds{namespace=\"chain-indexer\"}[5m])",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "waiting {{chainId}}"
              },
              {
                "refId": "B",
                "expr": "rate(envio_indexing_source_querying_seconds{namespace=\"chain-indexer\"}[5m])",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "querying {{chainId}}"
              },
              {
                "refId": "C",
                "expr": "rate(envio_indexing_idle_seconds{namespace=\"chain-indexer\"}[5m])",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
