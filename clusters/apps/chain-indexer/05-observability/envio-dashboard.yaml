apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envio-indexer
  namespace: ${APP_CHAIN_INDEXER_NAMESPACE}
spec:
  folderRef: ${APP_CHAIN_INDEXER_GRAFANA_FOLDER}
  instanceSelector:
    matchLabels:
      dashboards: grafana
  allowCrossNamespaceImport: true
  resyncPeriod: 1m
  json: |
      {
        "uid": "envio-indexer",
        "title": "Envio Indexer",
        "description": "Envio HyperIndex operations: health, where the wall clock goes, sync progress, fetching, handlers, storage, reorgs and Node.js runtime.",
        "tags": [
          "chain-indexer",
          "envio"
        ],
        "editable": true,
        "schemaVersion": 39,
        "version": 1,
        "refresh": "30s",
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "timezone": "browser",
        "timepicker": {},
        "templating": {
          "list": [
            {
              "name": "chain",
              "label": "Chain",
              "type": "query",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "query": "label_values(envio_progress_block{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}, chainId)",
              "refresh": 1,
              "sort": 1,
              "multi": true,
              "includeAll": true,
              "current": {
                "text": "All",
                "value": "$__all",
                "selected": true
              },
              "options": [],
              "hide": 0
            }
          ]
        },
        "annotations": {
          "list": [
            {
              "name": "Show indexer restarts",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "enable": true,
              "hide": false,
              "iconColor": "orange",
              "expr": "changes(envio_process_start_time_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[$__interval]) > 0",
              "titleFormat": "Indexer restart",
              "step": "60s"
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "type": "row",
            "title": "Health",
            "collapsed": false,
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 24,
              "h": 1
            },
            "panels": []
          },
          {
            "id": 2,
            "type": "stat",
            "title": "Indexing",
            "description": "Whether the indexer advanced a block in the last 10 minutes.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 1,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "(increase(envio_progress_block{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"}[10m]) > bool 0)",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "background",
              "graphMode": "none",
              "textMode": "auto",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "0": {
                        "text": "STALLED",
                        "color": "red",
                        "index": 0
                      },
                      "1": {
                        "text": "INDEXING",
                        "color": "green",
                        "index": 1
                      }
                    }
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 3,
            "type": "stat",
            "title": "Sync state",
            "description": "envio_progress_ready = 1 when the chain is fully synced to head.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 4,
              "y": 1,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "min(envio_progress_ready{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"})",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "background",
              "graphMode": "none",
              "textMode": "auto",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "0": {
                        "text": "SYNCING",
                        "color": "orange",
                        "index": 1
                      },
                      "1": {
                        "text": "SYNCED",
                        "color": "green",
                        "index": 0
                      }
                    }
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 4,
            "type": "stat",
            "title": "Bottleneck",
            "description": "Whichever of fetch / storage / handlers / at-head is consuming the most wall clock right now.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 8,
              "y": 1,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "label_replace(topk(1, label_replace(rate(envio_processing_stalled_on_fetch_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[5m]), \"cause\", \"FETCH\", \"\", \"\") or label_replace(rate(envio_processing_stalled_on_storage_write_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[5m]), \"cause\", \"STORAGE\", \"\", \"\") or label_replace(rate(envio_processing_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[5m]), \"cause\", \"HANDLERS\", \"\", \"\") or label_replace(rate(envio_indexing_source_waiting_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[5m]), \"cause\", \"AT-HEAD\", \"\", \"\")), \"name\", \"$1\", \"cause\", \"(.*)\")",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "{{cause}}",
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "background",
              "graphMode": "none",
              "textMode": "name",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 5,
            "type": "stat",
            "title": "Blocks behind",
            "description": "known_height - progress_block. The primary 'is it keeping up' signal.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 12,
              "y": 1,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "envio_indexing_known_height{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"} - envio_progress_block{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "auto",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 1000
                    },
                    {
                      "color": "red",
                      "value": 5000
                    }
                  ]
                },
                "decimals": 0
              },
              "overrides": []
            }
          },
          {
            "id": 6,
            "type": "stat",
            "title": "ETA to head",
            "description": "Blocks remaining divided by current block rate.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 16,
              "y": 1,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "(envio_indexing_known_height{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"} - envio_progress_block{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"}) / clamp_min(rate(envio_progress_block{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"}[5m]), 0.001)",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "auto",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 600
                    },
                    {
                      "color": "red",
                      "value": 3600
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 7,
            "type": "stat",
            "title": "Total events",
            "description": "Cumulative events processed and reflected in the database.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 20,
              "y": 1,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(envio_progress_events{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"})",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "auto",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                },
                "decimals": 0
              },
              "overrides": []
            }
          },
          {
            "id": 8,
            "type": "stat",
            "title": "Events/sec",
            "description": "Event throughput.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 5,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(rate(envio_progress_events{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"}[5m]))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "area",
              "textMode": "auto",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ops",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                },
                "decimals": 1
              },
              "overrides": []
            }
          },
          {
            "id": 9,
            "type": "stat",
            "title": "Write latency",
            "description": "Event creation on chain to write landing in Postgres. Reported in milliseconds.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 4,
              "y": 5,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "max(envio_progress_latency{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"})",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "auto",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ms",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 60000
                    },
                    {
                      "color": "red",
                      "value": 300000
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 10,
            "type": "stat",
            "title": "Uptime",
            "description": "How long the indexer process has been running.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 8,
              "y": 5,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "max(envio_process_elapsed_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"})",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "auto",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 11,
            "type": "stat",
            "title": "Restarts (1h)",
            "description": "Self-reported process restarts. Catches in-process restarts a pod restart count misses.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 12,
              "y": 5,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "max(changes(envio_process_start_time_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[1h]))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "auto",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 1
                    },
                    {
                      "color": "red",
                      "value": 3
                    }
                  ]
                },
                "decimals": 0
              },
              "overrides": []
            }
          },
          {
            "id": 12,
            "type": "stat",
            "title": "Scrape target",
            "description": "Whether Prometheus can reach the indexer /metrics endpoint.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 16,
              "y": 5,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "min(up{job=\"${APP_CHAIN_INDEXER_SVC}\", namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"})",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "background",
              "graphMode": "none",
              "textMode": "auto",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "0": {
                        "text": "DOWN",
                        "color": "red",
                        "index": 0
                      },
                      "1": {
                        "text": "UP",
                        "color": "green",
                        "index": 1
                      }
                    }
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 13,
            "type": "stat",
            "title": "Version",
            "description": "Running HyperIndex version.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 20,
              "y": 5,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "expr": "envio_info{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "{{version}}",
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "none",
              "textMode": "name",
              "justifyMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 14,
            "type": "alertlist",
            "title": "Firing alerts",
            "description": "Live state of the indexer alert rules. Pending means the condition is true but its 'for' window has not elapsed yet.",
            "gridPos": {
              "x": 0,
              "y": 9,
              "w": 24,
              "h": 7
            },
            "options": {
              "viewMode": "list",
              "groupMode": "default",
              "maxItems": 20,
              "sortOrder": 3,
              "dashboardAlerts": false,
              "alertName": "",
              "alertInstanceLabelFilter": "{app=\"${APP_CHAIN_INDEXER_ALERT_APP}\"}",
              "folder": "",
              "showInstances": true,
              "stateFilter": {
                "firing": true,
                "pending": true,
                "noData": true,
                "normal": false,
                "error": true
              }
            }
          },
          {
            "id": 15,
            "type": "row",
            "title": "Time budget",
            "collapsed": false,
            "gridPos": {
              "x": 0,
              "y": 16,
              "w": 24,
              "h": 1
            },
            "panels": []
          },
          {
            "id": 16,
            "type": "timeseries",
            "title": "Where the wall clock goes",
            "description": "Each series is seconds-per-second, so the stack is the share of wall clock spent in each state. The tallest band is the bottleneck.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 17,
              "w": 24,
              "h": 8
            },
            "targets": [
              {
                "refId": "A",
                "expr": "rate(envio_processing_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[5m])",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "handlers"
              },
              {
                "refId": "B",
                "expr": "rate(envio_preload_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[5m])",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "preload"
              },
              {
                "refId": "C",
                "expr": "rate(envio_processing_stalled_on_fetch_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[5m])",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "stalled: fetch"
              },
              {
                "refId": "D",
                "expr": "rate(envio_processing_stalled_on_storage_write_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\"}[5m])",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "stalled: storage"
              },
              {
                "refId": "E",
                "expr": "sum(rate(envio_indexing_source_waiting_seconds{namespace=\"${APP_CHAIN_INDEXER_NAMESPACE}\", chainId=~\"$chain\"}[5m]))",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "waiting at head"
              },
              {
                "refId": "F",
