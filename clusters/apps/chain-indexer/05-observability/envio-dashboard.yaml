apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envio-indexer
  namespace: ${APP_CHAIN_INDEXER_NAMESPACE}
spec:
  folderRef: chain-indexer
  instanceSelector:
    matchLabels:
      dashboards: grafana
  allowCrossNamespaceImport: true
  resyncPeriod: 1m
  json: |
      {
        "uid": "envio-indexer",
        "title": "Envio Indexer",
        "description": "Envio HyperIndex internals: sync progress, fetching, handler processing, storage and reorgs.",
        "tags": [
          "chain-indexer",
          "envio"
        ],
        "editable": true,
        "schemaVersion": 39,
        "version": 1,
        "refresh": "30s",
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "timezone": "browser",
        "timepicker": {},
        "templating": {
          "list": []
        },
        "annotations": {
          "list": []
        },
        "panels": [
          {
            "id": 1,
            "type": "row",
            "title": "Sync",
            "collapsed": false,
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 24,
              "h": 1
            },
            "panels": []
          },
          {
            "id": 2,
            "type": "stat",
            "title": "Sync state",
            "description": "envio_progress_ready = 1 when the chain is fully synced to head.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 1,
              "w": 4,
              "h": 5
            },
            "targets": [
              {
                "refId": "A",
                "expr": "min(envio_progress_ready{namespace=\"chain-indexer\"})",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "instant": true,
                "range": false
              }
            ],
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "background",
              "graphMode": "none",
              "textMode": "auto"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "0": {
                        "text": "SYNCING",
                        "color": "orange",
                        "index": 1
                      },
                      "1": {
                        "text": "SYNCED",
                        "color": "green",
                        "index": 0
                      }
                    }
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "text",
                      "value": null
                    }
                  ]
                }
              },
              "overrides": []
            }
          },
          {
            "id": 3,
            "type": "timeseries",
            "title": "Blocks behind head",
            "description": "known_height - progress_block. The primary 'is it keeping up' signal.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 4,
              "y": 1,
              "w": 10,
              "h": 5
            },
            "targets": [
              {
                "refId": "A",
                "expr": "envio_indexing_known_height{namespace=\"chain-indexer\"} - envio_progress_block{namespace=\"chain-indexer\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "chain {{chainId}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "last",
                  "max"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 4,
            "type": "timeseries",
            "title": "Write latency",
            "description": "Milliseconds from event creation on chain to the write landing in Postgres.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 14,
              "y": 1,
              "w": 10,
              "h": 5
            },
            "targets": [
              {
                "refId": "A",
                "expr": "envio_progress_latency{namespace=\"chain-indexer\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "chain {{chainId}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "mean",
                  "max"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ms",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 5,
            "type": "timeseries",
            "title": "Block height",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 6,
              "w": 8,
              "h": 5
            },
            "targets": [
              {
                "refId": "A",
                "expr": "envio_progress_block{namespace=\"chain-indexer\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "processed {{chainId}}"
              },
              {
                "refId": "B",
                "expr": "envio_indexing_known_height{namespace=\"chain-indexer\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "head {{chainId}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "last"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 6,
            "type": "timeseries",
            "title": "Events/sec",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 8,
              "y": 6,
              "w": 8,
              "h": 5
            },
            "targets": [
              {
                "refId": "A",
                "expr": "rate(envio_progress_events{namespace=\"chain-indexer\"}[5m])",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "chain {{chainId}}"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": []
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ops",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 7,
            "type": "timeseries",
            "title": "Buffer",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 16,
              "y": 6,
              "w": 8,
              "h": 5
            },
            "targets": [
              {
                "refId": "A",
                "expr": "envio_indexing_buffer_size{namespace=\"chain-indexer\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "buffer {{chainId}}"
              },
              {
                "refId": "B",
                "expr": "envio_indexing_target_buffer_size{namespace=\"chain-indexer\"}",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "legendFormat": "target"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true,
                "calcs": [
                  "last"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "custom": {
                  "lineWidth": 1,
                  "fillOpacity": 12,
                  "showPoints": "never",
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            }
          },
          {
            "id": 8,
            "type": "row",
            "title": "Fetching and source",
            "collapsed": false,
            "gridPos": {
              "x": 0,
              "y": 11,
              "w": 24,
              "h": 1
            },
            "panels": []
          },
          {
            "id": 9,
            "type": "timeseries",
            "title": "Block-range fetches/sec",
            "description": "",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 12,
              "w": 8,
              "h": 6
            },
            "targets": [
              {
                "refId": "A",
