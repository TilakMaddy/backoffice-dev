apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: envio-indexer
  namespace: ${APP_CHAIN_INDEXER_NAMESPACE}
spec:
  folderRef: chain-indexer
  instanceSelector:
    matchLabels:
      dashboards: grafana
  allowCrossNamespaceImport: true
  resyncPeriod: 5m
  interval: 1m
  rules:
    - uid: envio-indexer-stopped
      title: Indexer stopped processing
      condition: B
      for: 10m
      execErrState: Alerting
      noDataState: Alerting
      labels:
        severity: warning
        app: chain-indexer
      annotations:
        summary: Indexer has not advanced a block in 10 minutes while not synced to head
        runbook: Check indexer logs and the Bottleneck panel on the Envio Indexer dashboard.
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: (increase(envio_progress_block{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"}[10m]) < bool 1) * (envio_progress_ready{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"} < bool 1)
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [0]

    - uid: envio-endpoint-down
      title: Production endpoint down
      condition: B
      for: 2m
      execErrState: Alerting
      noDataState: Alerting
      labels:
        severity: critical
        app: chain-indexer
      annotations:
        summary: No healthy Hasura upstreams behind the GraphQL route
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 300
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: min(envoy_cluster_membership_healthy{envoy_cluster_name=~"httproute/${APP_CHAIN_INDEXER_NAMESPACE}/${APP_CHAIN_INDEXER_GRAPHQL_ROUTE}.*"})
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: lt
                  params: [1]

    - uid: envio-indexer-restart
      title: Indexer restart
      condition: B
      for: 0m
      execErrState: OK
      noDataState: OK
      labels:
        severity: info
        app: chain-indexer
      annotations:
        summary: Indexer process restarted
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: changes(envio_process_start_time_seconds{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"}[10m])
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [0]

    - uid: envio-indexer-error-logs
      title: Indexer error logs
      condition: B
      for: 0m
      execErrState: OK
      noDataState: OK
      labels:
        severity: info
        app: chain-indexer
      annotations:
        summary: Indexer emitted error or fatal log lines in the last 5 minutes
      data:
        - refId: A
          datasourceUid: loki
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            datasource:
              type: loki
              uid: loki
            expr: sum(count_over_time({namespace="${APP_CHAIN_INDEXER_NAMESPACE}", app="indexer"} | json | log_level=~"error|fatal" [5m]))
            queryType: instant
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [0]

    - uid: envio-historical-sync-complete
      title: Historical sync complete
      condition: B
      for: 0m
      execErrState: OK
      noDataState: OK
      labels:
        severity: info
        app: chain-indexer
      annotations:
        summary: Indexer finished historical sync and reached the chain head
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 1800
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: hyperindex_synced_to_head{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"} * changes(hyperindex_synced_to_head{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"}[15m])
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [0]

    - uid: envio-indexer-down
      title: Indexer scrape target down
      condition: B
      for: 2m
      execErrState: Alerting
      noDataState: Alerting
      labels:
        severity: critical
        app: chain-indexer
      annotations:
        summary: Prometheus cannot scrape the indexer
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 300
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: up{job="indexer", namespace="${APP_CHAIN_INDEXER_NAMESPACE}"}
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: lt
                  params: [1]

    - uid: envio-metrics-stale
      title: Indexer metrics stale
      condition: B
      for: 5m
      execErrState: Alerting
      noDataState: Alerting
      labels:
        severity: critical
        app: chain-indexer
      annotations:
        summary: Indexer metric snapshot is more than 2 minutes old
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: time() - envio_process_metric_time_seconds{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"}
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [120]

    - uid: envio-restart-loop
      title: Indexer restart loop
      condition: B
      for: 5m
      execErrState: OK
      noDataState: OK
      labels:
        severity: warning
        app: chain-indexer
      annotations:
        summary: Indexer restarted more than twice in the last hour
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 3900
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: changes(envio_process_start_time_seconds{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"}[1h])
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [2]

    - uid: envio-falling-behind
      title: Indexer falling behind head
      condition: B
      for: 15m
      execErrState: OK
      noDataState: OK
      labels:
        severity: warning
        app: chain-indexer
      annotations:
        summary: Indexer is more than 5000 blocks behind the chain head
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: envio_indexing_known_height{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"} - envio_progress_block{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"}
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [5000]

    - uid: envio-write-latency-high
      title: Indexer write latency high
      condition: B
      for: 15m
      execErrState: OK
      noDataState: OK
      labels:
        severity: warning
        app: chain-indexer
      annotations:
        summary: More than 5 minutes between event creation on chain and the write landing in Postgres
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: max(envio_progress_latency{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"})
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [300000]

    - uid: envio-storage-bottleneck
      title: Indexer bottlenecked on storage writes
      condition: B
      for: 15m
      execErrState: OK
      noDataState: OK
      labels:
        severity: warning
        app: chain-indexer
      annotations:
        summary: Processing is paused waiting on Postgres writes for more than 30 percent of wall clock
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 1200
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: rate(envio_processing_stalled_on_storage_write_seconds{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"}[15m])
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [0.3]

    - uid: envio-fetch-bottleneck
      title: Indexer bottlenecked on fetching
      condition: B
      for: 30m
      execErrState: OK
      noDataState: OK
      labels:
        severity: info
        app: chain-indexer
      annotations:
        summary: Processing is stalled waiting on the data source for more than half of wall clock
        runbook: Usually HyperSync rate limiting. Check envio_source_request_seconds_total by method.
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 1200
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: rate(envio_processing_stalled_on_fetch_seconds{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"}[15m])
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [0.5]

    - uid: envio-reorg-detected
      title: Chain reorg detected
      condition: B
      for: 0m
      execErrState: OK
      noDataState: OK
      labels:
        severity: warning
        app: chain-indexer
      annotations:
        summary: A chain reorganisation was detected in the last 15 minutes
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 1200
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: sum(increase(envio_reorg_detected_total{namespace="${APP_CHAIN_INDEXER_NAMESPACE}"}[15m])) or vector(0)
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [0]

    - uid: envio-hasura-5xx
      title: Hasura serving 5xx
      condition: B
      for: 10m
      execErrState: OK
      noDataState: OK
      labels:
        severity: warning
        app: chain-indexer
      annotations:
        summary: GraphQL route is returning server errors
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/${APP_CHAIN_INDEXER_NAMESPACE}/${APP_CHAIN_INDEXER_GRAPHQL_ROUTE}.*", envoy_response_code_class="5"}[5m])) or vector(0)
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [0.1]

    - uid: envio-eventloop-blocked
      title: Indexer event loop blocked
      condition: B
      for: 10m
      execErrState: OK
      noDataState: OK
      labels:
        severity: warning
        app: chain-indexer
      annotations:
        summary: Node.js event loop p99 lag above 1s, a handler is blocking the loop
      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: prometheus
            expr: max(nodejs_eventloop_lag_p99_seconds{job="indexer", namespace="${APP_CHAIN_INDEXER_NAMESPACE}"})
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            conditions:
              - evaluator:
                  type: gt
                  params: [1]
