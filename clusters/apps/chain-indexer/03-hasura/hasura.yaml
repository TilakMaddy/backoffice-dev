apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: hasura-env
  namespace: chain-indexer
stringData:
  HASURA_GRAPHQL_DATABASE_URL: postgres://hasura:pass123@chain-indexer-rw.chain-indexer.svc.cluster.local:5432/indexer-db?sslmode=verify-full&sslrootcert=/etc/ssl/pg/ca.crt
  HASURA_GRAPHQL_ADMIN_SECRET: admin123

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasura
  namespace: chain-indexer
  labels:
    app: hasura
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hasura
  template:
    metadata:
      labels:
        app: hasura
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        node-role.kubernetes.io/general: ""
      topologySpreadConstraints:
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hasura
      volumes:
        - name: pg-ca
          secret:
            secretName: chain-indexer-ca
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: hasura
          image: hasura/graphql-engine:v2.50.1@sha256:5060c6b61db91fbc841394dbd8821bf76bd61f20a9ad3abf8bd6ecdcc06b1852
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: hasura-env
          env:
            - name: HASURA_GRAPHQL_ENABLE_CONSOLE
              value: "true"
            - name: HASURA_GRAPHQL_DEV_MODE
              value: "false"
            - name: HASURA_GRAPHQL_ENABLE_TELEMETRY
              value: "false"
            # Entity ids and uint256 values exceed IEEE-754; without this they
            # are returned as JSON numbers and silently lose precision.
            - name: HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES
              value: "true"
            - name: HASURA_GRAPHQL_NO_OF_RETRIES
              value: "10"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: pg-ca
              mountPath: /etc/ssl/pg
              readOnly: true
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hasura
  namespace: chain-indexer
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: hasura

---
apiVersion: v1
kind: Service
metadata:
  name: hasura
  namespace: chain-indexer
spec:
  selector:
    app: hasura
  ports:
    - name: http
      port: 8080
      targetPort: http
