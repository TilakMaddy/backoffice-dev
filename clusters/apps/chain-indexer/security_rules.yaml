apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: pg-chain-indexer-allowlists
  namespace: ${PLATFORM_NAMESPACE}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway
  type: JSONPatch
  jsonPatches:
    - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
      name: "${PLATFORM_NAMESPACE}/gateway/postgres-direct"
      operation:
        jsonPath: "$.filter_chains[?(@.name == 'tlsroute/${APP_CHAIN_INDEXER_NAMESPACE}/${APP_CHAIN_INDEXER_PG_ROUTE}-rw')]"
        path: "/filters/0"
        op: add
        value:
          name: envoy.filters.network.rbac
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
            stat_prefix: allowlist_chain_indexer_rw
            rules:
              action: ALLOW
              policies:
                allowed-clients:
                  permissions:
                    - any: true
                  principals: ${CHAIN_INDEXER_PG_ALLOWED_PRINCIPALS}

    - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
      name: "${PLATFORM_NAMESPACE}/gateway/postgres-direct"
      operation:
        jsonPath: "$.filter_chains[?(@.name == 'tlsroute/${APP_CHAIN_INDEXER_NAMESPACE}/${APP_CHAIN_INDEXER_PG_ROUTE}-ro')]"
        path: "/filters/0"
        op: add
        value:
          name: envoy.filters.network.rbac
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
            stat_prefix: allowlist_chain_indexer_ro
            rules:
              action: ALLOW
              policies:
                allowed-clients:
                  permissions:
                    - any: true
                  principals: ${CHAIN_INDEXER_PG_ALLOWED_PRINCIPALS}

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hasura-chain-indexer-allowlist
  namespace: ${APP_CHAIN_INDEXER_NAMESPACE}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP_CHAIN_INDEXER_GRAPHQL_ROUTE}
  authorization:
    defaultAction: Deny
    rules:
      - name: allowed-clients
        action: Allow
        principal:
          clientCIDRs: ${CHAIN_INDEXER_HASURA_ALLOWED_CIDRS}
