apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  CLUSTER_ZONE: us-west-2-aws-backoffice.oatlabs-staging.oatmilk.work
  PLATFORM_NAMESPACE: platform-system
  FLUX_INTERVAL: 2m0s
  FLUX_RETRY_INTERVAL: 30s
  FLUX_TIMEOUT: 3m0s
  PG_INSTANCES: "3"
  PG_POOLER_INSTANCES: "3"
  PG_STORAGE: 1Gi
  PG_WAL_STORAGE: 1Gi
  OP_VAULT_ENVIO_TOKEN: Envio/ubwxezyyaffdeg3q4xmabdyypy # token
  OP_VAULT_CHAIN_INDEXER_PG_PASSWORD: ChainIndexerPG-staging/password
  OP_VAULT_CHAIN_INDEXER_PG_SUPERUSER_PASSWORD: ChainIndexerPGSuperuser-staging/password
  OP_VAULT_CHAIN_INDEXER_HASURA_ADMIN_SECRET: Hasura-staging/admin_secret
  INDEXER_IMAGE_NAME: ghcr.io/tilakmaddy/my-envio-indexer:staging
  INDEXER_IMAGE_PULL_POLICY: Always
  INDEXER_KEEL_POLICY: force
  INDEXER_KEEL_TRIGGER: manual
  INDEXER_KEEL_POLL_INTERVAL: 1m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: common
  namespace: flux-system
spec:
  interval: 2m0s
  retryInterval: 30s
  timeout: 3m0s
  path: ./clusters/common
  prune: true
  wait: true
  dependsOn:
    - name: bootstrap
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 2m0s
  retryInterval: 30s
  timeout: 3m0s
  path: ./clusters/apps
  prune: true
  wait: true
  dependsOn:
    - name: common
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: ConfigMap
        name: chain-indexer-vars
