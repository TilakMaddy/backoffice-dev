apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-vars
  namespace: flux-system
data:
  PLATFORM_SOURCE: platform-foundation
  PLATFORM_PATH_PREFIX: ./clusters/packages/layer-zero
  PLATFORM_NAMESPACE: platform-system
  CLUSTER_NAME: us-west-2-aws-backoffice-dataplane
  CLUSTER_ZONE: us-west-2-aws-backoffice.oatlabs-staging.oatmilk.work
  ACME_EMAIL: tilak.madichetti@gmail.com
  ACME_ENV: staging # staging | production
  OP_VAULT: OatLabs
  OP_VAULT_CLOUDFLARE_TOKEN: Cloudflare/ukceipl2n4jri73dq2nwwayk5i # api_token_secret
  OP_VAULT_GRAFANA_ADMIN_USER: Grafana-staging/username
  OP_VAULT_GRAFANA_ADMIN_PASSWORD: Grafana-staging/password
  OP_VAULT_RESEND_SMTP_PASSWORD: Resend/password
  GRAFANA_SMTP_HOST: smtp.resend.com:587
  GRAFANA_SMTP_USER: resend
  GRAFANA_SMTP_FROM_ADDRESS: alerts@backoffice.oatmilk.work
  ALERT_EMAIL_TO: tilak.madichetti@gmail.com
  FLUX_INTERVAL: 2m0s
  FLUX_RETRY_INTERVAL: 30s
  FLUX_TIMEOUT: 3m0s
  ENVOY_REPLICAS: "3"
  SHIM_REPLICAS: "3"

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform-foundation
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: staging
  secretRef:
    name: flux-system
  recurseSubmodules: true
  url: https://github.com/TilakMaddy/backoffice-dev.git

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap
  namespace: flux-system
spec:
  interval: 2m0s
  retryInterval: 30s
  timeout: 3m0s
  path: ./clusters/packages/layer-zero/platform/bootstrap
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: platform-foundation
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars
