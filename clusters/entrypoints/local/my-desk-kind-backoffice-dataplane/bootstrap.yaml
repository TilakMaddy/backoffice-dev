apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-vars
  namespace: flux-system
data:
  PLATFORM_SOURCE: platform-foundation
  PLATFORM_PATH_PREFIX: ./clusters/packages/layer-zero
  PLATFORM_NAMESPACE: platform-system
  TXT_OWNER_ID: my-desk-kind-backoffice-dataplane
  CLUSTER_ZONE: backoffice.oatlabs-local.oatmilk.work
  ACME_EMAIL: tilak.madichetti@gmail.com
  ACME_ENV: staging # staging | production
  OP_VAULT: OatLabs
  OP_VAULT_CLOUDFLARE_TOKEN: local/cloudflare-api-token
  OP_VAULT_GRAFANA_ADMIN_USER: local/grafana-admin-username
  OP_VAULT_GRAFANA_ADMIN_PASSWORD: local/grafana-admin-password
  OP_VAULT_RESEND_SMTP_PASSWORD: local/resend-smtp-password
  GRAFANA_SMTP_HOST: smtp.resend.com:587
  GRAFANA_SMTP_USER: resend
  GRAFANA_SMTP_FROM_ADDRESS: alerts@backoffice.oatmilk.work
  ALERT_EMAIL_TO: tilak.madichetti@gmail.com
  GRAFANA_ALLOWED_CIDRS: '["0.0.0.0/0"]'
  FLUX_INTERVAL: 30s
  FLUX_RETRY_INTERVAL: 15s
  FLUX_TIMEOUT: 1m0s
  ENVOY_REPLICAS: "3"
  SHIM_REPLICAS: "3"

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform-foundation
  namespace: flux-system
spec:
  interval: 30s
  ref:
    branch: dev
  secretRef:
    name: flux-system
  recurseSubmodules: true
  url: https://github.com/TilakMaddy/backoffice-dev.git

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 15s
  timeout: 1m0s
  path: ./clusters/packages/layer-zero/platform/bootstrap
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: platform-foundation
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars
