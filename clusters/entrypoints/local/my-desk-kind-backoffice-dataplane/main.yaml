apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  CLUSTER_ZONE: backoffice.oatlabs-local.oatmilk.work
  PLATFORM_NAMESPACE: platform-system
  FLUX_INTERVAL: 30s
  FLUX_RETRY_INTERVAL: 15s
  FLUX_TIMEOUT: 1m0s
  PG_INSTANCES: "3"
  PG_POOLER_INSTANCES: "3"
  PG_STORAGE: 1Gi
  PG_WAL_STORAGE: 1Gi
  OP_VAULT_ENVIO_TOKEN: Envio/ubwxezyyaffdeg3q4xmabdyypy # token
  OP_VAULT_CHAIN_INDEXER_PG_PASSWORD: ChainIndexerPG-local/password
  OP_VAULT_CHAIN_INDEXER_PG_SUPERUSER_PASSWORD: ChainIndexerPGSuperuser-local/password
  OP_VAULT_CHAIN_INDEXER_HASURA_ADMIN_SECRET: Hasura-local/admin_secret
  INDEXER_IMAGE_NAME: my-envio-indexer:local
  INDEXER_IMAGE_PULL_POLICY: IfNotPresent
  INDEXER_KEEL_POLICY: never
  INDEXER_KEEL_TRIGGER: manual
  INDEXER_KEEL_POLL_INTERVAL: 1h

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: common
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 15s
  timeout: 1m0s
  path: ./clusters/common
  prune: true
  wait: true
  dependsOn:
    - name: bootstrap
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 15s
  timeout: 1m0s
  path: ./clusters/apps
  prune: true
  wait: true
  dependsOn:
    - name: common
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: ConfigMap
        name: chain-indexer-vars
