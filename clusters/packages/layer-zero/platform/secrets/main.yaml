apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-operators
  namespace: flux-system
spec:
  interval: ${FLUX_INTERVAL}
  retryInterval: ${FLUX_RETRY_INTERVAL}
  timeout: ${FLUX_TIMEOUT}
  path: ${PLATFORM_PATH_PREFIX:=.}/platform/secrets/0-operators
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${PLATFORM_SOURCE}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-eso
  namespace: flux-system
spec:
  interval: ${FLUX_INTERVAL}
  retryInterval: ${FLUX_RETRY_INTERVAL}
  timeout: ${FLUX_TIMEOUT}
  path: ${PLATFORM_PATH_PREFIX:=.}/platform/secrets/1-eso
  dependsOn:
    - name: secrets-operators
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${PLATFORM_SOURCE}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars
