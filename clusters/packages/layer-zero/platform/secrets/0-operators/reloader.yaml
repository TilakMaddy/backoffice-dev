apiVersion: v1
kind: Namespace
metadata:
  name: reloader-system

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: reloader-system
spec:
  interval: 30m
  url: https://stakater.github.io/stakater-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader-system
spec:
  chart:
    spec:
      chart: reloader
      version: "2.2.*"
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: reloader-system
  releaseName: reloader
  targetNamespace: reloader-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 5m
  values:
    reloader:
      watchGlobally: true
      # Writes a pod-template annotation instead of injecting a dummy env var,
      # so the rollout does not show up as drift against the applied manifest.
      reloadStrategy: annotations
      reloadOnCreate: true
      deployment:
        nodeSelector:
          node-role.kubernetes.io/general: ""
