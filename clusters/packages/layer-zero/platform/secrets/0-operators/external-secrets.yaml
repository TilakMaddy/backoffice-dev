apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-system

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  interval: 30m
  url: https://charts.external-secrets.io

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  chart:
    spec:
      chart: external-secrets
      version: "2.10.*"
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets-system
  releaseName: external-secrets
  targetNamespace: external-secrets-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 5m
  values:
    installCRDs: true
    crds:
      createPushSecret: false
      createClusterPushSecret: false
    processPushSecret: false
    processClusterPushSecret: false
    global:
      nodeSelector:
        node-role.kubernetes.io/general: ""
