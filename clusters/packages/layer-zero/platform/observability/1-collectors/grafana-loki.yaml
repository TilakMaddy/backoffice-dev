apiVersion: v1
kind: Namespace
metadata:
  name: loki-system

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: loki-system
spec:
  interval: 30m
  url: https://grafana.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki-system
spec:
  chart:
    spec:
      chart: loki
      version: "7.3.*"
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki-system
  releaseName: loki
  targetNamespace: loki-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 5m
  values:
    # SimpleScalable and Distributed both require object storage, as does the
    # Loki operator. SingleBinary is the only mode that runs on a PVC.
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      storage:
        type: filesystem

      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 336h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        query_timeout: 300s
        volume_enabled: true

        # Loki has no size-based retention, so a log storm would fill the
        # volume before the 336h window is reached and stall ingestion.
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 8
        per_stream_rate_limit: 5MB
        per_stream_rate_limit_burst: 20MB
        max_global_streams_per_user: 5000

      # retention_period is inert unless the compactor is told to enforce it.
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
        compaction_interval: 10m
        retention_delete_delay: 1h

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      nodeSelector:
        node-role.kubernetes.io/observability: ""
      tolerations:
        - key: node-role.kubernetes.io/observability
          operator: Exists
          effect: NoSchedule

    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0

    # chunksCache alone defaults to a 8Gi memcached request.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    gateway:
      enabled: false
    minio:
      enabled: false

    # Loki's own metrics: ingestion rate, dropped lines, compactor progress.
    monitoring:
      serviceMonitor:
        enabled: true
