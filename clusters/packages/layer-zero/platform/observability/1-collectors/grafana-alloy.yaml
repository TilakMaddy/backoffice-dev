apiVersion: v1
kind: Namespace
metadata:
  name: alloy-system

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: alloy-system
spec:
  interval: 30m
  url: https://grafana.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: alloy-system
spec:
  chart:
    spec:
      chart: alloy
      version: "1.12.*"
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: alloy-system
  releaseName: alloy
  targetNamespace: alloy-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 5m
  values:
    serviceMonitor:
      enabled: true

    controller:
      type: daemonset
      # Postgres and observability nodes are tainted; without this their logs
      # are never collected.
      tolerations:
        - operator: Exists

    alloy:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      configMap:
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
              target_label  = "pg_cluster"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.loki-system.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
