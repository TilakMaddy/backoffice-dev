apiVersion: v1
kind: Namespace
metadata:
  name: keel-system

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: keel
  namespace: keel-system
spec:
  interval: 30m
  url: https://charts.keel.sh

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keel
  namespace: keel-system
spec:
  chart:
    spec:
      chart: keel
      version: "1.2.*"
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: keel
        namespace: keel-system
  releaseName: keel
  targetNamespace: keel-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 5m
  values:
    helmProvider:
      enabled: false
    polling:
      enabled: true
      defaultSchedule: "@every 1m"
    service:
      enabled: false
    nodeSelector:
      node-role.kubernetes.io/general: ""
