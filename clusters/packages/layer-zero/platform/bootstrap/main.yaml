apiVersion: v1
kind: Namespace
metadata:
  name: ${PLATFORM_NAMESPACE}
  labels:
    oatlabs.oatmilk.work/gateway-access: "true"

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: ${FLUX_INTERVAL}
  retryInterval: ${FLUX_RETRY_INTERVAL}
  timeout: ${FLUX_TIMEOUT}
  path: ${PLATFORM_PATH_PREFIX:=.}/platform/secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${PLATFORM_SOURCE}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: underlay
  namespace: flux-system
spec:
  interval: ${FLUX_INTERVAL}
  retryInterval: ${FLUX_RETRY_INTERVAL}
  timeout: ${FLUX_TIMEOUT}
  path: ${PLATFORM_PATH_PREFIX:=.}/platform/underlay
  dependsOn:
    - name: secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${PLATFORM_SOURCE}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: ${FLUX_INTERVAL}
  retryInterval: ${FLUX_RETRY_INTERVAL}
  timeout: ${FLUX_TIMEOUT}
  path: ${PLATFORM_PATH_PREFIX:=.}/platform/observability
  dependsOn:
    - name: underlay
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${PLATFORM_SOURCE}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars
