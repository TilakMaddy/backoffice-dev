apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${APP_CHAIN_INDEXER_PG_CLUSTER}-daily
  namespace: ${APP_CHAIN_INDEXER_NAMESPACE}
spec:
  cluster:
    name: ${APP_CHAIN_INDEXER_PG_CLUSTER}
  schedule: "${PG_BACKUP_SCHEDULE}"
  immediate: true
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
